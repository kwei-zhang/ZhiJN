[platformio]
; 默认板型：你的 ESP32-S3-WROOM-1 (N16R8)，插在 UART 口
default_envs = esp32-s3

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
monitor_filters = direct, esp32_exception_decoder
lib_deps =
    bblanchon/ArduinoJson@^7

[env:esp32-s3]
; ESP32-S3-WROOM-1 N16R8（16MB Quad Flash + 8MB Octal PSRAM），使用 UART 口通信
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0

[env:esp32-s3-usb]
; 同一块 ESP32-S3 N16R8，如果改插 USB/OTG 口时用这个环境
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32dev]
; 经典 ESP32-WROOM-32
board = esp32dev

[env:esp32-c3]
; ESP32-C3 DevKitM（C3 仅支持硬件 USB CDC，需配合 ARDUINO_USB_MODE=1）
board = esp32-c3-devkitm-1
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
